{% extends "emails/base_email.html" %}

{% block content %}
<div style="text-align: center; padding: 20px;">
    <h2 style="color: #3b82f6; font-size: 24px;">Restablece tu contraseña</h2>
    <p style="color: #4b5563; font-size: 16px;">Hola {{ nombre }},</p>
    <p style="color: #4b5563; font-size: 16px;">Recibimos una solicitud para restablecer tu contraseña. Haz clic en el botón de abajo para continuar:</p>
    <a href="{{ reset_url }}" style="display: inline-block; background-color: #3b82f6; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none;">Restablecer Contraseña</a>
    <p style="color: #9ca3af; font-size: 14px; margin-top: 20px;">Si no solicitaste este cambio, ignora este correo.</p>
</div>
{% endblock %}
