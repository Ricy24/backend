{% extends "emails/base_email.html" %}

{% block content %}
<div style="text-align: center; padding: 20px;">
    <h2 style="color: #3b82f6; font-size: 24px;">Confirmación de Compra</h2>
    <p style="color: #4b5563; font-size: 16px;">Hola {{ nombre }},</p>
    <p style="color: #4b5563; font-size: 16px;">Gracias por tu compra. Aquí están los detalles:</p>
    <ul style="list-style: none; padding: 0;">
        <li><strong>Referencia:</strong> {{ reference_code }}</li>
        <li><strong>Total Pagado:</strong> {{ total_amount }}</li>
    </ul>
    <p style="color: #4b5563; font-size: 16px;">Puedes ver más detalles en tu panel de usuario.</p>
</div>
{% endblock %}
